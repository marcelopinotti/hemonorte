        motivo:
          type:
            - string
            - "null"
        proximaDataPermitida:
          type:
            - string
            - "null"
          format: date
    CriarSlotRequest:
      type: object
      properties:
        inicio:
          type: string
          format: date-time
        capacidade:
          type: integer
          format: int32
          minimum: 1
      required:
        - inicio
    SlotAgenda:
      type: object
      properties:
        id:
          type: string
          format: uuid
        inicio:
          type: string
          format: date-time
        capacidade:
          type: integer
          format: int32
