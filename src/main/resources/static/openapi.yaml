      type: object
      properties:
        nome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        perfil:
          type: string
          enum:
            - TRIAGEM
            - COLETA
            - LABORATORIO
            - ADMIN
      required:
        - email
        - nome
        - perfil
    FuncionarioResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        matricula:
          type: string
        nome:
          type: string
        email:
          type: string
        perfil:
          type: string
          enum:
            - TRIAGEM
            - COLETA
            - LABORATORIO
            - ADMIN
