      type: object
      properties:
        nome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        tipagem:
          type: string
          pattern: "(?i)(A|B|AB|O)[+-]"
        dataNascimento:
          type: string
          format: date
        genero:
          type: string
          pattern: "[MF]"
      required:
        - email
        - nome
