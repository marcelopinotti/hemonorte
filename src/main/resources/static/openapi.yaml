      type: object
      properties:
        status:
          type: string
          enum:
            - EM_ANALISE
            - DISPONIVEL
            - UTILIZADA
            - DESCARTADA
            - VENCIDA
        motivo:
          type:
            - string
            - "null"
          maxLength: 255
          minLength: 0
      required:
        - status
    BolsaSangueResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agendamentoId:
          type: string
          format: uuid
