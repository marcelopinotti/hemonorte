spring:
  application:
    name: hemonorte


  datasource:
    url: jdbc:postgresql://localhost:5432/hemonorte
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        show_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus



